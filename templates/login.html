<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — LinkManager</title>
<link rel="icon" href="{{ url_for('static', filename='images/icon.png') }}">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #202124; color: #e8eaed;
    font-family: 'Roboto', system-ui, -apple-system, sans-serif;
  }
  .caja {
    width: 100%; max-width: 380px; padding: 2.2rem;
    background: #303134; border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  .logo { display: flex; align-items: center; gap: .7rem; margin-bottom: 1.6rem; }
  .logo img { height: 34px; }
  .logo span { font-size: 1.15rem; font-weight: 500; color: #e8eaed; }
  label { display: block; font-size: .84rem; color: #bdc1c6; margin-bottom: .35rem; }
  input {
    width: 100%; padding: .75rem .9rem; margin-bottom: 1.1rem;
    background: #202124; color: #e8eaed; font-size: 1rem;
    border: 1px solid #5f6368; border-radius: 8px;
  }
  input:focus { outline: none; border-color: #8ab4f8; }
  button {
    width: 100%; padding: .8rem; font-size: 1rem; font-weight: 500;
    background: #8ab4f8; color: #202124; border: 0; border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #a7c8fa; }
  .error {
    background: rgba(242,139,130,.12); border: 1px solid #f28b82; color: #f28b82;
    padding: .6rem .8rem; border-radius: 8px; font-size: .88rem; margin-bottom: 1.1rem;
  }
  .pie { margin-top: 1.2rem; font-size: .8rem; color: #9aa0a6; text-align: center; }
  .pie a { color: #8ab4f8; text-decoration: none; }
</style>
</head>
<body>
  <form class="caja" method="post" action="{{ url_for('login', next=next) }}">
    <div class="logo">
      <img src="{{ url_for('static', filename='images/linkmanager-logo.png') }}" alt="">
      <span>LinkManager</span>
    </div>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensaje in mensajes %}
        <div class="error">{{ mensaje }}</div>
      {% endfor %}
    {% endwith %}

    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" type="text" autocomplete="username"
           required autofocus value="admin">

    <label for="clave">Contraseña</label>
    <input id="clave" name="clave" type="password" autocomplete="current-password" required>

    <button type="submit">Entrar</button>

    <p class="pie"><a href="{{ url_for('index') }}">&larr; volver a los enlaces</a></p>
  </form>
</body>
</html>
